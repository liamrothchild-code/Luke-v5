<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luke’s Choice</title>
<style>
:root{--blue:#2e6ef7;--red:#e63946}
body{
  margin:0;height:100vh;overflow:hidden;
  font-family:Segoe UI,Arial,sans-serif;
  background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364);
  background-size:400% 400%;
  animation:bg 12s ease infinite;
  color:white;
}
@keyframes bg{0%{background-position:0 50%}50%{100% 50%}100%{0 50%}}
.center{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}
h1{font-size:3rem;margin-bottom:60px}
button{
  font-size:1.4rem;
  padding:18px 42px;
  border:none;border-radius:14px;
  cursor:pointer;color:white;
  position:absolute;
}
#dem{background:var(--blue);left:-160px}
#rep{background:var(--red);left:160px}
.party{
  display:none;
  position:fixed;inset:0;
  background:radial-gradient(circle,#1e3c72,#000);
  text-align:center;padding-top:30px;
}
.party h2{font-size:3.2rem;margin-bottom:10px}
.uploads{
  margin:20px auto;
  display:flex;
  gap:20px;
  justify-content:center;
}
input{color:white}
.images img{
  height:220px;
  margin:15px;
  border-radius:14px;
  box-shadow:0 0 30px rgba(255,255,255,.4);
}
.confetti{
  position:fixed;
  width:10px;height:16px;
  background:var(--blue);
  animation:fall 3s linear infinite;
}
@keyframes fall{
  from{top:-10vh;transform:rotate(0)}
  to{top:110vh;transform:rotate(360deg)}
}
</style>
</head>
<body>

<div class="center">
  <h1>Luke, are you a Democrat or Republican?</h1>
  <button id="dem">Democrat</button>
  <button id="rep">Republican</button>
</div>

<div class="party" id="party">
  <h2>💙 DEMOCRAT CONFIRMED 💙</h2>

  <div class="uploads">
    <label>
      Donkey Image:
      <input type="file" accept="image/*" id="donkeyInput">
    </label>
    <label>
      Hillary Images:
      <input type="file" accept="image/*" id="hillaryInput" multiple>
    </label>
  </div>

  <div class="images" id="images"></div>
</div>

<script>
const rep=document.getElementById("rep");
const dem=document.getElementById("dem");
const party=document.getElementById("party");
const images=document.getElementById("images");

rep.onclick=()=>{
  rep.style.left=Math.random()*80+"vw";
  rep.style.top=Math.random()*80+"vh";
};

dem.onclick=()=>{
  party.style.display="block";
  for(let i=0;i<140;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.animationDelay=Math.random()*3+"s";
    c.style.background=Math.random()>.5?"#2e6ef7":"#fff";
    document.body.appendChild(c);
  }
};

function previewFiles(input){
  [...input.files].forEach(file=>{
    const img=document.createElement("img");
    img.src=URL.createObjectURL(file);
    images.appendChild(img);
  });
}

donkeyInput.onchange=e=>previewFiles(e.target);
hillaryInput.onchange=e=>previewFiles(e.target);
</script>

</body>
</html>
